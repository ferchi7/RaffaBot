<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RaffaBot | Rafaello's Pizza</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f7f4f1;color:#202020;overflow:hidden}
.app{height:100dvh;display:flex;max-width:1100px;margin:auto;background:#fff}
.side{width:260px;background:#191919;color:#fff;padding:22px;display:flex;flex-direction:column}
.brand-logo{width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 8px}.logo{text-align:center;font-size:25px;font-weight:800}.logo b{color:#e21d25}
.sub{font-size:13px;line-height:1.5;color:#ddd;margin:8px 0 24px}
.side button{width:100%;padding:14px 12px;margin:5px 0;border:0;border-radius:12px;background:#303030;color:#fff;text-align:left;font-size:14px;cursor:pointer}
.side button:hover{background:#e21d25}
.note{margin-top:auto;background:#272727;border-radius:12px;padding:12px;font-size:12px;line-height:1.45;color:#ddd}
.main{min-width:0;min-height:0;flex:1;display:flex;flex-direction:column}
.head{flex:0 0 auto;padding:14px 18px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}
.head-brand{display:flex;align-items:center;gap:10px}.head-logo{width:48px;height:48px;object-fit:contain}.title{font-size:19px;font-weight:800}.place{font-size:12px;color:#777;margin-top:2px}.online{font-size:12px;color:#16833a}
.chat{flex:1;min-height:0;overflow-y:auto;padding:18px 16px;background:#fffdfb;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.msg{max-width:84%;padding:14px 16px;border-radius:16px;margin:9px 0;line-height:1.55;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#fff;border:1px solid #eadfd7;border-top-left-radius:5px}.user{margin-left:auto;background:#d71920;color:#fff;border-top-right-radius:5px}
.quick{flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;padding:9px 12px;border-top:1px solid #eee;background:#fff;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{white-space:nowrap;border:1px solid #f0c7c7;background:#fff7f7;color:#a51116;border-radius:999px;padding:9px 12px;font-size:13px;cursor:pointer}
.bar{flex:0 0 auto;display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #eee;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.bar input{min-width:0;flex:1;border:1px solid #ccc;border-radius:13px;padding:14px;font-size:16px;outline:0}
.bar input:focus{border-color:#d71920}.send{border:0;border-radius:13px;background:#d71920;color:#fff;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.card{width:min(650px,96vw);max-height:90dvh;overflow:auto;background:#fff;border-radius:18px;padding:20px}
.close{float:right;border:0;border-radius:8px;padding:8px;cursor:pointer}
.card h2{margin-top:0}.q{border:1px solid #eadfd7;border-radius:12px;padding:13px;margin:10px 0}.q button{display:block;width:100%;margin-top:7px;padding:10px;text-align:left;border:1px solid #ddd;background:#fafafa;border-radius:9px;cursor:pointer}.correct{background:#e9faef!important;border-color:#32a852!important}.wrong{background:#fff0ef!important;border-color:#e33!important}
@media(max-width:700px){
 .side{display:none}.head-logo{width:42px;height:42px}.app{width:100%;height:100dvh}
 .head{padding:11px 13px}.online{display:none}
 .chat{padding:14px 10px}.msg{max-width:94%;font-size:15px}
 .send{padding:0 14px}.bar{padding:9px 10px}
}
</style>
</head>

 "🧼 Debes realizar higiene de manos:\n\n1. Antes de iniciar la jornada.\n2. Antes de manipular alimentos.\n3. Después de ir al baño.\n4. Después de tocar dinero o el celular.\n5. Después de manipular basura o alimentos crudos.\n6. Después de toser, estornudar o sonarte.\n7. Al cambiar de actividad.\n8. Cuando exista riesgo de contaminación.\n\nProcedimiento:\n1. Mojar las manos con agua.\n2. Aplicar jabón.\n3. Frotar palmas, dorsos, dedos, uñas y muñecas.\n4. Enjuagar.\n5. Secar con toalla desechable.\n6. Cerrar el grifo con la toalla cuando corresponda.\n\n⚠️ Los guantes no reemplazan el lavado de manos."],

 [["contaminacion cruzada","contaminación cruzada","que es contaminacion cruzada","qué es contaminación cruzada","como evito contaminacion","cómo evito contaminación","contaminar alimentos","crudo y cocido","separar crudos","alimentos crudos de cocidos"],

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function respuesta(q){
 let n=norm(q),best=null,score=0;
 for(const [keys,text] of kb){let s=0;for(const k of keys){let x=norm(k);if(n.includes(x))s+=x.includes(" ")?3:1}if(s>score){score=s;best=text}}
 return best||FALLBACK;
}
function add(text,who){
 const d=document.createElement("div");d.className="msg "+who;d.textContent=text;
 const c=document.getElementById("chat");c.appendChild(d);
 requestAnimationFrame(()=>c.scrollTo({top:c.scrollHeight,behavior:"smooth"}));
}
